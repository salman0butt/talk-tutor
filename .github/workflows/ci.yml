name: Learning Platform CI

on:
  push:
    branches:
      - feat/personalized-learning-vocabulary
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: learning-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talk_tutor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talk_tutor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Verify Supabase migration and RLS schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: talk_tutor_ci
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_ci.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260909000000_learning_platform.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260909090000_personalized_learning_vocabulary.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/learning_platform_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/learning_platform_rls_runtime.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/personalized_learning_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/personalized_learning_rls_runtime.sql

      - name: Production build
        run: pnpm build
